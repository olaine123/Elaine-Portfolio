<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Access — Elaine Chen</title>
  <style>
    :root { color-scheme: dark; --red:#ef3d3d; --line:#333; --muted:#999; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#0b0b0b; color:#f5f5f5; font-family:Arial, sans-serif; }
    main { width:min(420px,100%); border:1px solid var(--line); padding:32px; background:#141414; }
    .eyebrow { margin:0 0 12px; color:var(--red); font:12px/1.4 monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0 0 10px; font-size:28px; font-weight:400; }
    p { color:var(--muted); line-height:1.5; }
    form { display:grid; gap:14px; margin-top:26px; }
    label { display:grid; gap:8px; color:var(--muted); font-size:13px; }
    input { width:100%; padding:13px; border:1px solid var(--line); background:#0b0b0b; color:#fff; font:inherit; }
    input:focus { outline:none; border-color:var(--red); }
    button { padding:13px; border:1px solid var(--red); background:var(--red); color:#fff; cursor:pointer; font:inherit; }
    #message { min-height:20px; color:#ef7777; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Private area</p>
    <h1>Portfolio Admin</h1>
    <p>Enter the admin password to edit the portfolio.</p>
    <form id="login-form">
      <label>Password<input id="password" type="password" autocomplete="current-password" required autofocus></label>
      <button type="submit">Enter admin</button>
      <div id="message" role="status"></div>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/admin';
    const message = document.getElementById('message');
    if (params.get('error') === 'config') message.textContent = 'Admin access is not configured yet.';
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      message.textContent = 'Checking…';
      const response = await fetch('/api/admin-login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ password:document.getElementById('password').value, next }) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) { message.textContent = data.error || 'Unable to sign in.'; return; }
      location.href = data.next || '/admin';
    });
  </script>
</body>
</html>
